name: Build Android Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'Download-Latest-APK.bat'
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom release version tag (e.g. 6.1.12, leave blank to use version.properties)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Ensure Persistent Keystore
        run: |
          mkdir -p ~/.android
          cp app/persistent-debug.keystore ~/.android/debug.keystore

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Single Universal Release APK
        run: |
          set -o pipefail
          ./gradlew assembleUniversalGmsRelease --stacktrace --no-daemon 2>&1 | tee build.log
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DONATION_UPI_ID: ${{ secrets.DONATION_UPI_ID || 'burhanuddin08@fam' }}
          DONATION_PAYEE_NAME: ${{ secrets.DONATION_PAYEE_NAME || 'PulseWave' }}

      - name: Extract Dynamic Version
        id: get_version
        run: |
          # 1. Read from input or version.properties
          INPUT_VER="${{ inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            VERSION=$(echo "$INPUT_VER" | sed 's/^v//')
          else
            MAJOR=$(grep 'VERSION_MAJOR' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
            MINOR=$(grep 'VERSION_MINOR' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
            PATCH=$(grep 'VERSION_PATCH' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          # 2. Check for tag collision on remote to ensure a brand-new release is always created
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Warning: Tag ${TAG} already exists on remote. Auto-incrementing patch version to guarantee a fresh release!"
            MAJOR_PART=$(echo "$VERSION" | cut -d'.' -f1)
            MINOR_PART=$(echo "$VERSION" | cut -d'.' -f2)
            PATCH_PART=$(echo "$VERSION" | cut -d'.' -f3)
            PATCH_PART=$((PATCH_PART + 1))
            VERSION="${MAJOR_PART}.${MINOR_PART}.${PATCH_PART}"
            echo "Auto-bumped version to: ${VERSION}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Rename Release APK with App Name and Version
        run: |
          VERSION="${{ steps.get_version.outputs.tag }}"
          for f in app/build/outputs/apk/universalGms/release/*.apk; do
            if [ -f "$f" ]; then
              mv "$f" "app/build/outputs/apk/universalGms/release/PulseWave-${VERSION}-universal-release.apk"
              break
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseWave-${{ steps.get_version.outputs.tag }}-apk
          path: app/build/outputs/apk/universalGms/release/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/universalGms/release/*.apk
            changelog.json
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Pulse Wave ${{ steps.get_version.outputs.tag }} (Universal Release)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: build.log

      - name: Dump Failure Log to Step Summary
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "### Gradle Build Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 250 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload ProGuard/R8 Mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-gms-mapping
          path: app/build/outputs/mapping/universalGmsRelease/mapping.txt
          if-no-files-found: ignore
