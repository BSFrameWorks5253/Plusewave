name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Create Default Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Single Universal Release APK
        run: |
          set -o pipefail
          ./gradlew assembleUniversalGmsRelease --stacktrace --no-daemon 2>&1 | tee build.log
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Upload Build Failure Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: build.log

      - name: Dump Failure Log to Step Summary
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "### Gradle Build Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 250 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Push Build Log to Debug Branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B ci-build-log
          if [ -f build.log ]; then
            git add -f build.log
          fi
          MAPPING_FILE="app/build/outputs/mapping/universalGmsRelease/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            mkdir -p debug-output
            cp "$MAPPING_FILE" debug-output/mapping.txt
            git add -f debug-output/mapping.txt
          fi
          git commit -m "ci: capture build log and mapping" || true
          git push origin ci-build-log --force

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseWave-release-apk
          path: app/build/outputs/apk/universalGms/release/*.apk

      - name: Upload ProGuard/R8 Mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-gms-mapping
          path: app/build/outputs/mapping/universalGmsRelease/mapping.txt
          if-no-files-found: ignore
      - name: Extract Dynamic Version
        id: get_version
        run: |
          MAJOR=$(grep 'VERSION_MAJOR' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          MINOR=$(grep 'VERSION_MINOR' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          PATCH=$(grep 'VERSION_PATCH' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/universalGms/release/*.apk
            changelog.json
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Pulse Wave v${{ steps.get_version.outputs.version }} (Universal Release)
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
